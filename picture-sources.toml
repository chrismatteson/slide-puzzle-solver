# Openly licensed pictures for the synthetic picture-puzzle photos (scripts/gen_picture_photos.py).
# `npm run pictures:fetch` downloads them into data/pictures/ (gitignored) and checks sha256.
# All are public-domain works (artist died long ago, or NASA / US government) from Wikimedia Commons;
# `license` is as stated on the source page. Wikimedia serves the 1280 px thumbnail.
#
# split: `dev` pictures are for tuning the assembly; `eval` pictures are held out and must never be
# used for tuning (the held-out numbers in the README come from them).

