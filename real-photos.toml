# Real photographs of numbered sliding-tile puzzles: a held-out test set for `readBoard`.
# `npm run real:fetch` downloads them into data/real/ (gitignored) and checks sha256;
# `npm run real:eval` writes the labels below next to them and runs scripts/eval.ts.
#
# One [[photo]] table per photo:
#   name     file stem under data/real/ (extension comes from `url`: .jpg, .jpeg or .png)
#   page     source page; url = direct file URL; author; license (as stated on the source page)
#   sha256   of the downloaded bytes (fetch refuses a file that does not match)
#   size     3 or 4;  state = row-major tile numbers, 0 = the empty slot, as seen in the photo
#
# Only photos whose every tile could be read with certainty are listed. Photos of loose tiles, boxes,
# drawings, screenshots, or tiles whose digits were ambiguous (e.g. a 6 that might be a 9) are left out.
# Many real puzzles are in states unreachable from the goal; they stay in the set, the reader should
# reject them. Wikimedia serves the 1280 px thumbnail, so the downloads are not rate limited.

